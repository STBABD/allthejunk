<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Clubhouse Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fairway:#16301F;
    --fairway-2:#1E4029;
    --turf:#2F6B45;
    --paper:#F3EEDF;
    --paper-2:#E9E1CC;
    --ink:#1B2119;
    --ink-soft:#5B6259;
    --flag:#AC3B2A;
    --flag-soft:#E7CCC5;
    --gold:#BE9A44;
    --gold-soft:#EEE3C4;
    --line:#C9BE9E;
    --radius:14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0;
    background:var(--fairway);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.4);
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--fairway);
    color:var(--paper);
    padding:16px 18px 14px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 22px);
    pointer-events:none;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    position:relative; z-index:1;
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand .sub{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--gold-soft);
    opacity:0.8;
    letter-spacing:0.5px;
  }
  .hole-nav{
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:10px;
    position:relative; z-index:1;
  }
  .hole-nav button{
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06);
    color:var(--paper);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .hole-nav button:active{ background:rgba(255,255,255,0.18); }
  .pin{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
  }
  .pin svg{ width:20px; height:26px; flex-shrink:0; }
  .pin .num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    line-height:1;
  }
  .hole-meta{
    position:relative; z-index:1;
    margin-top:10px;
    display:flex; gap:10px; justify-content:center;
  }
  .hole-meta .field{
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .hole-meta label{
    font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:0.6px;
    color:var(--gold-soft); opacity:0.85; text-transform:uppercase;
  }
  .hole-meta select{
    background:rgba(255,255,255,0.06); color:var(--paper); border:1px solid rgba(255,255,255,0.3);
    border-radius:7px; font-family:'Space Mono',monospace; font-size:12px; padding:4px 8px;
  }

  /* full 18-hole tap-to-jump strip */
  .hole-strip{
    position:relative; z-index:1;
    margin-top:12px;
    display:flex; gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .hole-strip button{
    flex:0 0 auto;
    width:34px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:8px;
    color:rgba(243,238,223,0.75);
    padding:5px 0 4px;
    display:flex; flex-direction:column; align-items:center; gap:1px;
    cursor:pointer;
  }
  .hole-strip button .n{ font-family:'Space Mono',monospace; font-weight:700; font-size:11.5px; }
  .hole-strip button .p{ font-family:'Space Mono',monospace; font-size:8.5px; opacity:0.7; }
  .hole-strip button.done{ border-color:rgba(190,154,68,0.5); }
  .hole-strip button.done .n::after{ content:"·"; color:var(--gold); margin-left:2px; }
  .hole-strip button.cur{
    background:var(--gold); border-color:var(--gold); color:var(--fairway);
  }

  /* dashboard hero (top of Setup) */
  .hero{
    background:var(--fairway);
    color:var(--paper);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:14px;
  }
  .hero h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px;
    margin:6px 0 14px; line-height:1.3; max-width:26ch;
  }
  .hero .stat-row{ display:flex; gap:10px; margin-bottom:14px; }
  .hero .stat{
    flex:1; background:rgba(255,255,255,0.07); border-radius:10px; padding:10px 12px;
  }
  .hero .stat .n{ font-family:'Space Mono',monospace; font-weight:700; font-size:20px; }
  .hero .stat .l{ font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.4px; opacity:0.75; text-transform:uppercase; margin-top:2px; }
  .active-round-card{
    background:var(--turf);
    border-radius:12px; padding:14px 16px;
  }
  .active-round-card .name{ font-family:'Fraunces',serif; font-weight:700; font-size:17px; }
  .active-round-card .meta{ font-family:'Space Mono',monospace; font-size:10.5px; opacity:0.85; margin-top:2px; }
  .avatar-row{ display:flex; gap:6px; margin:10px 0; }
  .avatar{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono',monospace; font-weight:700; font-size:11px;
    color:#fff; flex-shrink:0;
  }
  .progress-track{
    height:6px; border-radius:999px; background:rgba(255,255,255,0.2);
    margin:10px 0; overflow:hidden;
  }
  .progress-fill{ height:100%; background:var(--gold); border-radius:999px; }
  .status-badge{
    display:inline-block; font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700;
    letter-spacing:0.4px; padding:3px 8px; border-radius:999px; text-transform:uppercase;
  }
  .status-badge.live{ background:var(--gold); color:var(--fairway); }
  .status-badge.idle{ background:rgba(255,255,255,0.15); color:var(--paper); }

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex;
    background:var(--fairway-2);
    position:sticky; top:0; z-index:5;
  }
  nav.tabs button{
    flex:1;
    padding:11px 1px;
    background:none;
    border:none;
    color:rgba(243,238,223,0.55);
    font-family:'Space Mono',monospace;
    font-size:8.5px;
    letter-spacing:0.15px;
    text-transform:uppercase;
    border-bottom:3px solid transparent;
    cursor:pointer;
  }
  nav.tabs button.active{
    color:var(--paper);
    border-bottom-color:var(--gold);
  }

  /* ---------- Main content ---------- */
  main{
    flex:1;
    padding:16px 16px calc(90px + var(--safe-b));
    overflow-y:auto;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 6px;
  }

  .strokes-strip{
    display:flex; flex-wrap:wrap; gap:6px;
    margin-bottom:14px;
  }
  .strokes-strip .pill{
    font-family:'Space Mono',monospace;
    font-size:11px; font-weight:700;
    padding:5px 10px; border-radius:999px;
    background:var(--paper-2); color:var(--ink-soft);
    display:flex; align-items:center; gap:5px;
  }
  .strokes-strip .pill.gets{
    background:var(--gold-soft); color:#6b551f;
  }
  .strokes-strip .pill .swatch{ width:7px; height:7px; border-radius:50%; }

  /* player pills */
  .player-row{
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
  }
  .player-row .swatch{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .player-row input.name-input{ flex:1; margin-bottom:0; }
  .player-row input.hcp-input{
    width:62px; padding:10px 6px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Space Mono',monospace; text-align:center; font-size:13px;
  }

  /* buttons/choices */
  .choice-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    padding:7px 13px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:13px; font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .chip.selected{
    background:var(--fairway);
    border-color:var(--fairway);
    color:var(--paper);
  }
  .chip.gold.selected{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
  .chip.flag.selected{ background:var(--flag); border-color:var(--flag); color:#fff; }
  .chip.small{ padding:5px 10px; font-size:12px; }

  select.wolf-select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    background:var(--paper);
    color:var(--ink);
  }
  label.field-label{
    font-size:12px; font-weight:600; color:var(--ink-soft);
    display:block; margin:12px 0 6px;
  }

  /* dots grid */
  .dot-table{ width:100%; border-collapse:collapse; }
  .dot-table th{
    font-family:'Space Mono',monospace;
    font-size:9.5px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--ink-soft); font-weight:600;
    padding:0 3px 8px; text-align:center;
  }
  .dot-table th:first-child{ text-align:left; }
  .dot-table td{ padding:6px 3px; text-align:center; border-top:1px dotted var(--line); }
  .dot-table td:first-child{ text-align:left; padding-right:6px; }
  .player-cell{ font-weight:600; font-size:12.5px; line-height:1.3; }
  .player-cell .badge{
    display:block; font-family:'Space Mono',monospace; font-size:9.5px;
    color:var(--gold); font-weight:700;
  }
  .dotbox{
    width:27px; height:27px; border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--paper);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; cursor:pointer; color:transparent;
  }
  .dotbox.on{ background:var(--turf); border-color:var(--turf); color:#fff; }
  .dotbox.neg.on{ background:var(--flag); border-color:var(--flag); }

  /* snake */
  .snake-holder{
    display:flex; align-items:center; gap:12px;
    background:var(--flag-soft);
    border:1px solid var(--flag);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .snake-holder .icon{ font-size:26px; }
  .snake-holder .txt .who{ font-family:'Fraunces',serif; font-weight:700; font-size:16px; color:var(--flag); }
  .snake-holder .txt .lbl{ font-family:'Space Mono',monospace; font-size:10.5px; color:#7a382e; letter-spacing:0.4px; }
  .snake-log{ font-size:12.5px; color:var(--ink-soft); line-height:1.7; }
  .snake-log .cur{ color:var(--flag); font-weight:700; }

  /* summary */
  .totals-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .totals-row:last-child{ border-bottom:none; }
  .totals-row .name{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; }
  .totals-row .breakdown{ font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .totals-row .grand{
    font-family:'Space Mono',monospace; font-weight:700; font-size:20px;
  }
  .grand.pos{ color:var(--turf); }
  .grand.neg{ color:var(--flag); }
  .grand.zero{ color:var(--ink-soft); }

  .settings-grid{ display:grid; grid-template-columns:1fr 70px; gap:8px 10px; align-items:center; }
  .settings-grid label{ font-size:13px; }
  .settings-grid input{
    width:100%; padding:7px 8px; border-radius:8px; border:1.5px solid var(--line);
    font-family:'Space Mono',monospace; text-align:center; font-size:13px;
  }

  .note{
    font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:4px;
  }

  .card-scroll{ overflow-x:auto; margin:0 -16px; padding:0 16px; }
  table.scorecard{ border-collapse:collapse; font-family:'Space Mono',monospace; }
  table.scorecard th, table.scorecard td{
    padding:5px 6px; text-align:center; font-size:10.5px; white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  table.scorecard th{ color:var(--ink-soft); font-weight:700; }
  table.scorecard td.label, table.scorecard th.label{
    position:sticky; left:0; background:#fff; text-align:left; font-family:'Inter',sans-serif;
    font-weight:700; font-size:12px; z-index:2; padding-right:10px;
    box-shadow:2px 0 4px rgba(0,0,0,0.05);
  }
  table.scorecard tr.divider td, table.scorecard tr.divider th{ background:var(--paper-2); }
  .sc-score{ font-weight:700; font-size:12px; }
  .sc-score.birdie{ color:var(--turf); }
  .sc-score.eagle{ color:var(--gold); }
  .sc-score.bogey{ color:var(--flag); }
  .sc-dots{ font-size:8.5px; color:var(--ink-soft); letter-spacing:0.3px; }
  .sc-dots.paid{ color:var(--flag); }
  .sc-wolf-win{ color:var(--turf); font-weight:700; }
  .sc-wolf-lose{ color:var(--flag); font-weight:700; }
  .sc-wolf-push{ color:var(--ink-soft); }

  .empty{
    text-align:center; padding:30px 10px; color:var(--ink-soft);
  }
  .empty .big{ font-size:34px; margin-bottom:8px; }

  button.primary{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:none;
    background:var(--fairway);
    color:var(--paper);
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    margin-top:6px;
  }
  button.ghost{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    margin-top:8px;
  }
  input.name-input{
    width:100%; padding:10px 12px; border-radius:10px;
    border:1.5px solid var(--line); font-size:14px; margin-bottom:8px;
    font-family:'Inter',sans-serif;
  }

  /* bottom tab bar */
  .tabbar{
    position:fixed;
    left:50%; transform:translateX(-50%);
    bottom:0;
    width:100%; max-width:480px;
    background:var(--fairway);
    display:flex;
    padding:8px 6px calc(10px + var(--safe-b));
    box-shadow:0 -4px 18px rgba(0,0,0,0.25);
    z-index:10;
  }
  .tabbar button{
    flex:1;
    background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:rgba(243,238,223,0.5);
    padding:6px 1px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:8.5px;
    font-weight:600;
  }
  .tabbar button .ic{ font-size:15px; }
  .tabbar button.active{ color:var(--gold); }

  ::-webkit-scrollbar{ display:none; }

  /* spectator (read-only) mode: navigation stays usable, mutation doesn't */
  body.viewer main input, body.viewer main select, body.viewer main .chip,
  body.viewer main .dotbox, body.viewer main button.primary, body.viewer main button.ghost,
  body.viewer .hole-meta select, body.viewer .hole-nav button{
    pointer-events:none; opacity:0.65;
  }

  /* full-screen auth gate: hide the normal chrome entirely */
  body.unauth header, body.unauth nav.tabs, body.unauth .tabbar{ display:none; }
  body.unauth main{ padding-top:60px; padding-bottom:40px; }
  .auth-card{ max-width:340px; margin:0 auto; }
  .auth-card input{
    width:100%; padding:12px 14px; border-radius:10px;
    border:1.5px solid var(--line); font-size:15px; margin-bottom:10px;
    font-family:'Inter',sans-serif;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <h1>Clubhouse Ledger</h1>
      <div class="sub" id="roundLabel">18-HOLE ROUND</div>
    </div>
    <div class="hole-nav">
      <button id="prevHole" aria-label="Previous hole">‹</button>
      <div class="pin">
        <svg viewBox="0 0 20 26" fill="none">
          <line x1="2" y1="26" x2="2" y2="1" stroke="#F3EEDF" stroke-width="2"/>
          <path d="M2 2 L18 6 L2 11 Z" fill="#BE9A44"/>
        </svg>
        <div class="num" id="holeNum">1</div>
      </div>
      <button id="nextHole" aria-label="Next hole">›</button>
    </div>
    <div class="hole-meta">
      <div class="field">
        <label>Par</label>
        <select id="parSelect">
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="field">
        <label>Stroke Index</label>
        <select id="hcpSelect"></select>
      </div>
    </div>
    <div class="hole-strip" id="holeStrip"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="setup" class="active">Setup</button>
    <button data-tab="score">Score</button>
    <button data-tab="wolf">Wolf</button>
    <button data-tab="snake">Snake</button>
    <button data-tab="dots">Dots</button>
    <button data-tab="summary">Ledger</button>
    <button data-tab="history">History</button>
  </nav>

  <main id="main"></main>

  <div class="tabbar" id="tabbar">
    <button data-tab="setup" class="active"><span class="ic">⛳</span>Setup</button>
    <button data-tab="score"><span class="ic">#</span>Score</button>
    <button data-tab="wolf"><span class="ic">🐺</span>Wolf</button>
    <button data-tab="snake"><span class="ic">🐍</span>Snake</button>
    <button data-tab="dots"><span class="ic">•</span>Dots</button>
    <button data-tab="summary"><span class="ic">Σ</span>Ledger</button>
    <button data-tab="history"><span class="ic">📜</span>History</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var MAX_PLAYERS = 6;
  var DOT_KEYS = [
    {key:"greenie", label:"Greenie"},
    {key:"sandy", label:"Sandy"},
    {key:"birdie", label:"Birdie"},
    {key:"eagle", label:"Eagle"},
    {key:"poley", label:"Poley"},
    {key:"threeputt", label:"3-Putt"}
  ];
  var SWATCHES = ["#2F6B45","#AC3B2A","#BE9A44","#3B5C8C","#7A4FA0","#2E8B8B"];

  function blankPlayers(){ var a=[]; for(var i=0;i<MAX_PLAYERS;i++) a.push(""); return a; }
  function blankHandicaps(){ var a=[]; for(var i=0;i<MAX_PLAYERS;i++) a.push(0); return a; }
  function blankSnakeThresholds(){ var a=[]; for(var i=0;i<MAX_PLAYERS;i++) a.push(3); return a; }

  var defaultState = {
    players: blankPlayers(),
    handicaps: blankHandicaps(),
    snakeThresholds: blankSnakeThresholds(),
    activePlayers: 5,
    currentHole: 1,
    roundName: "",
    holePar: {},               // hole -> 3/4/5
    holeHcp: {},                // hole -> stroke index 1-18
    wolf: {},                   // hole -> {wolf:idx, partners:[idx,...], result:'wolfwin'|'oppwin'|'push', manual:bool}
    scores: {},                  // hole -> {playerIdx: grossStrokes}
    putts: {},                   // hole -> {playerIdx: numberOfPutts}
    snakeTieBreak: {},           // hole -> playerIdx who finished last among a putts-tie (takes the snake)
    snakeEvents: [],             // kept only for legacy data; derived automatically from putts now
    dots: {},                    // hole -> {playerIdx: {greenie:bool,...}}
    points: {greenie:1, sandy:1, birdie:1, eagle:2, poley:1, threeputt:1},
    wolfUnit: 1,
    snakeStake: 1,               // dots the end-of-round snake holder owes, folded into Payouts only
    dollarPerPoint: 0,
    shareCode: null,             // set when the scorer shares the round live
    shareToken: null             // write token; never included in the synced payload
  };

  var state = null;
  var activeTab = "setup";
  var STORAGE_KEY = "clubhouse_ledger_round_v2";

  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  // ---------------- LIVE SYNC (spectator mode) ----------------
  // Optional: paste your Firebase web-app config object here to enable
  // "Share round" live spectating (see README, "Live spectator mode").
  // Leave as null and the app runs exactly as before, fully offline.
  var SYNC_CONFIG = {

  // ---------------- WOLF LOGIC ----------------
  function wolfForHole(hole){
    var n = state.activePlayers;
    return (hole - 1) % n;

  // The wolf for a hole always follows the rotation UNLESS this specific hole's
  // wolf was explicitly overridden by the user (entry.wolfManual). This means
  // any stale/frozen entry from earlier testing or a reordered roster heals
  // itself back to the correct rotation automatically.
  // A hole counts as "played" once any active player has a gross score for it —
  // this is the point past which the wolf for that hole must stop changing.
  function isHolePlayed(hole){
    for(var pi=0; pi<state.activePlayers; pi++){

    }
    return false;
  }

  function effectiveWolfIndex(hole){
    var entry = state.wolf[hole];
    var auto = wolfForHole(hole);
    if(!entry) return auto;

    if(entry.wolfManual){
      // manual override always wins, but still guard against an out-of-range
      // index left over from a since-shrunk roster (see #4)
      return (entry.wolf < state.activePlayers) ? entry.wolf : auto;

      // change if the roster size changes later. Still fall back to auto if
      // the frozen index itself is now out of range, to avoid resurfacing #4.
      return (entry.wolf < state.activePlayers) ? entry.wolf : auto;
    }

    // Not yet played: keep self-healing to the live rotation (fixes stale
    // frozen entries from earlier testing/roster changes), and persist the
    // current value so that whenever this hole DOES get played, whatever
    // was live at that moment is what gets frozen.

  function wolfTeamsFor(hole){

    for(var i=0;i<n;i++){ if(wolfTeam.indexOf(i) === -1) othersTeam.push(i); }

  }

  // Auto-computes the net-score winner for a hole's Wolf matchup, best-ball style
  // (each team's best net score represents the team). Returns null if not enough
  // scores are entered yet to decide.
  function autoWolfResult(hole){
    var entry = state.wolf[hole];
    if(!entry) return null;
    var teams = wolfTeamsFor(hole);
    function bestNet(team){
      var vals = team.map(function(p){ return netFor(p, hole); }).filter(function(v){ return v !== null; });
      if(vals.length === 0) return null;
      return Math.min.apply(null, vals);
    }
    var wb = bestNet(teams.wolfTeam);
    var ob = bestNet(teams.othersTeam);
    if(wb === null || ob === null) return null;
    if(wb < ob) return "wolfwin";
    if(ob < wb) return "oppwin";
    return "push";
  }

  // Carry-over multiplier heading into `hole`, based on consecutive pushes
  // immediately before it (resets to 1 after any decisive result).
  function computeCarryIntoHole(hole){
    var carry = 1;
    for(var h=1; h<hole; h++){
      var entry = state.wolf[h];
      if(!entry) continue;
      var result = entry.manual ? entry.result : autoWolfResult(h);
      if(!result) continue;
      if(result === "push") carry += 1;
      else carry = 1;
    }
    return carry;
  }

  // Wolf scoring: each winning player earns a flat number of points based
  // only on how many pushes carried into the hole -- 1 for a normal win, 2
  // after one carryover, 3 after two, etc. Team size does NOT scale the
  // payout: a lone wolf winning banks the same per-player amount as a
  // 3-person winning team. Losers gain nothing (gross-wins model), which
  // is what the Ledger and Payouts are built on.
  function computeWolfGrossWins(endHole){
    if(endHole === undefined) endHole = 18;
    var n = state.activePlayers;
    var totals = new Array(n).fill(0);
    var carry = 1;
    for(var hole=1; hole<=endHole; hole++){
      var entry = state.wolf[hole];
      if(!entry) continue;
      var result = entry.manual ? entry.result : autoWolfResult(hole);
      if(!result) continue;
      if(result === "push"){
        carry += 1;
        continue;
      }
      var unit = state.wolfUnit * carry;
      var teams = wolfTeamsFor(hole);
      var wolfWon = result === "wolfwin";
      var winningTeam = wolfWon ? teams.wolfTeam : teams.othersTeam;
      winningTeam.forEach(function(p){ totals[p] += unit; });
      carry = 1;
    }
    return totals;
  }

  // ---------------- DOTS LOGIC ----------------
  function computeDotTotals(endHole){
    if(endHole === undefined) endHole = 18;
    var n = state.activePlayers;
    var totals = new Array(n).fill(0);
    var counts = [];
    for(var i=0;i<n;i++){
      var c = {}; DOT_KEYS.forEach(function(d){ c[d.key]=0; }); counts.push(c);
    }
    // Manual dots (greenie, sandy, poley — birdie/eagle are now derived from scores)
    for(var h in state.dots){
      if(parseInt(h,10) > endHole) continue;
      var holeData = state.dots[h];
      for(var pIdx in holeData){
        var pi = parseInt(pIdx,10);
        if(pi >= n) continue;
        DOT_KEYS.forEach(function(d){
          if(d.key === "threeputt" || d.key === "birdie" || d.key === "eagle") return;
          if(d.key === "greenie" && (state.holePar[h] || 4) !== 3) return;
          if(holeData[pIdx][d.key]){
            totals[pi] += state.points[d.key];
            counts[pi][d.key]++;
          }
        });
      }
    }
    // Birdie/eagle: derived from gross score vs par
    for(var hb=1; hb<=endHole; hb++){
      var bpar = state.holePar[hb] || 4;
      for(var pi2b=0; pi2b<n; pi2b++){
        var gb = grossFor(pi2b, hb);
        if(gb === null) continue;
        var bdiff = gb - bpar;
        if(bdiff <= -2){
          totals[pi2b] += state.points.eagle;
          counts[pi2b].eagle++;
        } else if(bdiff === -1){
          totals[pi2b] += state.points.birdie;
          counts[pi2b].birdie++;
        }
      }
    }
    // putt threshold: derived from entered putts, paid by the putter to everyone else
    for(var hh=1; hh<=endHole; hh++){
      if(!state.putts[hh]) continue;
      for(var pi2=0; pi2<n; pi2++){
        var putts = puttsFor(pi2, hh);
        if(putts === null) continue;
        if(putts >= puttThreshold(pi2)){
          counts[pi2].threeputt++;
          for(var j=0;j<n;j++){ if(j !== pi2) totals[j] += state.points.threeputt; }
        }
      }
    }
    return {totals: totals, counts: counts};
  }

  // ---------------- RENDER ----------------
  function el(tag, attrs, children){
    var e = document.createElement(tag);

      // boolean attributes (selected, disabled, checked...) are set by mere
      // presence — setAttribute(k, false) would still enable them, so use the
      // DOM property instead
      else if(typeof attrs[k] === "boolean") e[k] = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){
      if(typeof c === "string") e.appendChild(document.createTextNode(c));
      else if(c) e.appendChild(c);
    });
    return e;
  }

  function searchCourses(query){

    fetch(OPENGOLF_BASE + "/courses/search?q=" + encodeURIComponent(query) + "&limit=10")
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(data){
        courseSearchResults = data.courses || [];
        courseSearchStatus = "idle";
        render();
      })
      .catch(function(e){
        console.error("course search failed", e);
        courseSearchStatus = "error";

      });

  // The API's exact field names for hole-by-hole data aren't independently
  // confirmed yet — this tries several plausible shapes and falls back to
  // showing the raw response so it can be fixed quickly if the real shape
  // differs.
  function parseCourseHoles(data){
    var raw = data.holes || data.scorecard || (data.course && (data.course.holes || data.course.scorecard));
    if(!raw) return null;
    var list = Array.isArray(raw) ? raw : Object.keys(raw).map(function(k){ return Object.assign({hole: parseInt(k,10)}, raw[k]); });
    var out = {};
    var ok = true;
    list.forEach(function(h){
      var num = h.hole || h.number || h.hole_number;
      var par = h.par;
      var idx = h.handicap != null ? h.handicap : (h.handicap_index != null ? h.handicap_index : (h.stroke_index != null ? h.stroke_index : h.hcp));
      if(num == null || par == null || idx == null){ ok = false; return; }
      out[num] = {par: par, hcp: idx};
    });
    if(!ok || Object.keys(out).length < 9) return null; // didn't find enough usable holes — bail to raw fallback
    return out;
  }

  function loadCourse(courseId){
    courseLoadStatus = "loading"; courseLoadDebug = null; render();
    fetch(OPENGOLF_BASE + "/courses/" + courseId)
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(data){
        var holes = parseCourseHoles(data);
        if(!holes){
          courseLoadStatus = "error";
          courseLoadDebug = JSON.stringify(data, null, 2).slice(0, 2000);
          render();
          return;
        }
        Object.keys(holes).forEach(function(num){
          state.holePar[num] = holes[num].par;
          state.holeHcp[num] = holes[num].hcp;
        });
        saveState();
        courseLoadStatus = "loaded";
        courseSearchResults = null;
        courseSearchQuery = "";
        render();
      })
      .catch(function(e){
        console.error("course load failed", e);
        courseLoadStatus = "error";
        render();
      });
  }

  function renderScore(main){
    var hole = state.currentHole;
    var n = state.activePlayers;
    var names = activeNames();
    var par = state.holePar[hole] || 4;
    // entering a score freezes this hole's wolf, so heal it to the live rotation first
    effectiveWolfIndex(hole);
    if(!state.scores[hole]) state.scores[hole] = {};
    if(!state.putts[hole]) state.putts[hole] = {};
    var holeScores = state.scores[hole];
    var holePutts = state.putts[hole];

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["# Hole " + hole + " — score & putts  ·  Par " + par]));
    var headRow = el("div", {style:"display:flex; align-items:center; gap:8px; margin-bottom:2px;"});
    headRow.appendChild(el("div", {style:"flex:1;"}));
    headRow.appendChild(el("div", {class:"eyebrow", style:"width:62px; text-align:center; margin:0;"}, ["Gross"]));
    headRow.appendChild(el("div", {class:"eyebrow", style:"width:62px; text-align:center; margin:0;"}, ["Putts"]));
    card.appendChild(headRow);
    for(var i=0;i<n;i++){
      (function(pi){
        var s = strokesFor(pi, hole);
        var g = grossFor(pi, hole);
        var p = puttsFor(pi, hole);
        var thresh = puttThreshold(pi);
        var breakdown = el("div", {class:"breakdown"});
        function breakdownText(){
          var net = netFor(pi, hole);
          return (s > 0 ? ("+" + s + " stroke  ·  ") : "") +
            (net !== null ? ("net " + net) : "net —") +
            (thresh > 3 ? ("  ·  " + thresh + "-putt rule") : "");

        // only the net label depends on the value, so update it in place
        row.appendChild(el("input", {
          class:"hcp-input", type:"number", placeholder:"—", min:"1", max:"15",
          value: g === null ? "" : g,

        row.appendChild(el("input", {

    card.appendChild(el("div", {class:"note"}, [
      "Net score = gross − strokes received. Wolf auto-suggests a winner from net scores. Putts feed Snake and the 3-Putt dot automatically — each player's putt threshold is set in Setup."
    ]));

  function renderWolf(main){
    var hole = state.currentHole;
    var n = state.activePlayers;

    if(!entry.partners) entry.partners = [];
    if(entry.manual === undefined) entry.manual = false;
    if(entry.wolfManual === undefined) entry.wolfManual = false;
    var effectiveWolf = effectiveWolfIndex(hole);

    var suggestion = autoWolfResult(hole);

    var carry = computeCarryIntoHole(hole);

        ]);

  function renderDots(main){
    var hole = state.currentHole;
    var n = state.activePlayers;
    var names = activeNames();
    if(!state.dots[hole]) state.dots[hole] = {};
    var holeData = state.dots[hole];
    for(var i=0;i<n;i++){
      if(!holeData[i]) holeData[i] = {};
    }

    var par = state.holePar[hole] || 4;
    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["• Hole " + hole + " Dots"]));
    var table = el("table", {class:"dot-table"});
    var thead = el("tr");
    thead.appendChild(el("th", {}, ["Player"]));
    DOT_KEYS.forEach(function(d){ thead.appendChild(el("th", {}, [d.label])); });
    table.appendChild(thead);

    for(var p=0;p<n;p++){
      (function(pi){
        var tr = el("tr");
        var s = strokesFor(pi, hole);
        var thresh = puttThreshold(pi);
        var nameCell = el("td");
        var pc = el("div", {class:"player-cell"}, [names[pi]]);
        if(s>0) pc.appendChild(el("span", {class:"badge"}, ["+" + s + " stroke" + (s>1?"s":"")]));
        if(thresh > 3) pc.appendChild(el("span", {class:"badge"}, [thresh + "-putt rule"]));
        nameCell.appendChild(pc);
        tr.appendChild(nameCell);
        DOT_KEYS.forEach(function(d){
          var td = el("td");
          if(d.key === "threeputt"){
            var putts = puttsFor(pi, hole);
            var hit = putts !== null && putts >= thresh;
            td.appendChild(el("div", {class:"dotbox neg" + (hit?" on":"")}, [hit ? "●" : ""]));
          } else if(d.key === "birdie" || d.key === "eagle"){
            var g = grossFor(pi, hole);
            var ddiff = g !== null ? g - par : null;
            var bon = d.key === "birdie" ? ddiff === -1 : (ddiff !== null && ddiff <= -2);
            td.appendChild(el("div", {class:"dotbox" + (bon?" on":"")}, [bon ? "●" : ""]));
          } else if(d.key === "greenie" && par !== 3){
            td.appendChild(el("div", {class:"dotbox", style:"opacity:0.25; cursor:default;"}, ["—"]));
          } else {
            var on = !!holeData[pi][d.key];
            td.appendChild(el("div", {
              class:"dotbox" + (on?" on":""),
              onclick:function(){
                holeData[pi][d.key] = !holeData[pi][d.key];
                saveState(); render();
              }
            }, [on ? "●" : ""]));
          }
          tr.appendChild(td);
        });
        table.appendChild(tr);
      })(p);
    }

    card.appendChild(el("div", {class:"note"}, [

    ]));
    main.appendChild(card);

    var dotRes = computeDotTotals();
    var sumCard = el("div", {class:"card"});
    sumCard.appendChild(el("h2", {}, ["Dots so far"]));
    names.forEach(function(nm, i){
      var t = dotRes.totals[i];
      var row = el("div", {class:"totals-row"});
      var breakdown = DOT_KEYS.filter(function(d){return dotRes.counts[i][d.key]>0;})
        .map(function(d){
          if(d.key === "threeputt") return "3-Putt x" + dotRes.counts[i][d.key] + " (paid out)";
          return d.label + " x" + dotRes.counts[i][d.key];
        }).join(" · ");
      var nameCol = el("div", {}, [
        el("div", {class:"name"}, [el("span", {class:"swatch", style:"background:"+SWATCHES[i]}), nm]),
        breakdown ? el("div", {class:"breakdown"}, [breakdown]) : null
      ]);
      row.appendChild(nameCol);
      row.appendChild(el("div", {class:"grand " + (t>0?"pos":t<0?"neg":"zero")}, [(t>0?"+":"")+t]));
      sumCard.appendChild(row);
    });
    main.appendChild(sumCard);
  }

  function sumHolePar(start, end){
    var t = 0;
    for(var h=start; h<=end; h++){ t += (state.holePar[h] || 4); }
    return t;
  }

  function sumGross(pi, start, end){
    var t = 0, any = false;
    for(var h=start; h<=end; h++){
      var g = grossFor(pi, h);
      if(g !== null){ t += g; any = true; }
    }
    return any ? t : null;
  }

  function dotAbbrevs(pi, hole){
    var holeData = state.dots[hole] && state.dots[hole][pi];
    var out = [];
    if(holeData){
      if((state.holePar[hole]||4) === 3 && holeData.greenie) out.push("G");
      if(holeData.sandy) out.push("S");
      if(holeData.poley) out.push("P");
    }
    var g = grossFor(pi, hole);
    if(g !== null){
      var diff = g - (state.holePar[hole] || 4);
      if(diff <= -2) out.push("E");
      else if(diff === -1) out.push("B");
    }
    return out;
  }

    // One row per player: gross score (colored) + dot abbreviations + putt-threshold marker
    for(var pi=0; pi<n; pi++){
      (function(pi){

          el("span", {class:"swatch", style:"background:"+SWATCHES[pi]+"; margin-right:6px; display:inline-block;"}),
          names[pi]
        ]));
        for(var h=1; h<=18; h++){
          var par = state.holePar[h] || 4;

          var scoreClass = "sc-score";
          if(g !== null){

            else if(diff === -1) scoreClass += " birdie";

        var out = sumGross(pi,1,9), inn = sumGross(pi,10,18), tot = sumGross(pi,1,18);
        row.appendChild(el("td", {}, [el("div", {class:"sc-score"}, [out===null?"–":String(out)])]));
        row.appendChild(el("td", {}, [el("div", {class:"sc-score"}, [inn===null?"–":String(inn)])]));

    ]));

  function holeHasData(h){
    for(var i=0;i<state.activePlayers;i++){
      if(grossFor(i,h) !== null || puttsFor(i,h) !== null) return true;
    }
    var w = state.wolf[h];
    if(w && (w.manual ? w.result : autoWolfResult(h))) return true;
    var d = state.dots[h];
    if(d){
      for(var pIdx in d){ for(var k in d[pIdx]){ if(d[pIdx][k]) return true; } }
    }
    return false;
  }

  function fmtDollars(v){
    var s = Math.abs(v) % 1 === 0 ? String(Math.abs(v)) : Math.abs(v).toFixed(2);
    return (v < 0 ? "-$" : "$") + s;
  }

  function renderMoneyCard(main, names){
    var n = state.activePlayers;
    var lastHole = 0;
    for(var h=1;h<=18;h++){ if(holeHasData(h)) lastHole = h; }

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["📈 Total dots through the round"]));
    if(lastHole === 0){
      card.appendChild(el("div", {class:"note"}, ["No holes played yet — the running tally builds here as scores come in."]));
      main.appendChild(card);
      return;
    }

    // cumulative gross dots (Wolf wins + Dots) per player after each hole 1..lastHole
    var cum = [];
    for(var h2=1; h2<=lastHole; h2++){
      var wg = computeWolfGrossWins(h2);
      var dt = computeDotTotals(h2).totals;
      var row = [];
      for(var i=0;i<n;i++){ row.push(wg[i] + dt[i]); }
      cum.push(row);
    }

    var final = cum[cum.length-1];
    var best = Math.max.apply(null, final);
    var leaders = [];
    for(var li=0; li<n; li++){ if(final[li] === best) leaders.push(names[li]); }
    card.appendChild(el("div", {class:"eyebrow"}, [
      "Through hole " + lastHole + " — " + leaders.join(" & ") + (leaders.length>1 ? " lead" : " leads") + " at " + best + " dots"
    ]));

    var scroll = el("div", {class:"card-scroll"});
    var table = el("table", {class:"scorecard"});
    var headRow = el("tr");
    headRow.appendChild(el("th", {class:"label"}, [""]));
    for(var h3=1; h3<=lastHole; h3++){ headRow.appendChild(el("th", {}, [String(h3)])); }
    table.appendChild(headRow);
    for(var p=0;p<n;p++){
      (function(pi){
        var tr = el("tr");
        tr.appendChild(el("th", {class:"label"}, [
          el("span", {class:"swatch", style:"background:"+SWATCHES[pi]+"; margin-right:6px; display:inline-block;"}),
          names[pi]
        ]));
        for(var h=1; h<=lastHole; h++){
          var v = cum[h-1][pi];
          tr.appendChild(el("td", {}, [
            el("div", {class:"sc-score" + (v>0?" birdie":"")}, [String(v)])
          ]));
        }
        table.appendChild(tr);
      })(p);
    }
    scroll.appendChild(table);
    card.appendChild(scroll);
    card.appendChild(el("div", {class:"note"}, [
      "Cumulative gross dots (Wolf wins + Dots) after each hole. Swipe sideways for the full round. See Payouts above for what the gap between players actually means in $."
    ]));
    main.appendChild(card);
  }

  // Total dots = gross Wolf wins + Dots. The Snake stake is added to every
  // OTHER player's total (the holder pays each of them, same pattern as the
  // 3-Putt dot) rather than subtracted from the holder — so the holder's
  // own total can never go negative just from holding the snake. Payout
  // rule: whoever has fewer total dots owes the exact difference to
  // whoever has more — pairwise, for every pair, not just neighbors in rank.
  function renderPayouts(main, names, wolfGross, dotsGross, snakeHolder){
    var n = state.activePlayers;
    var combined = [];
    for(var i=0;i<n;i++){
      var v = wolfGross[i] + dotsGross[i];
      if(snakeHolder !== null && i !== snakeHolder) v += state.snakeStake;
      combined.push(v);
    }

    var order = [];
    for(var i2=0;i2<n;i2++) order.push(i2);
    order.sort(function(a,b){ return combined[b] - combined[a]; });

    var useDollars = state.dollarPerPoint > 0;
    function fmt(amount){ return useDollars ? fmtDollars(amount * state.dollarPerPoint) : (amount + " dot" + (amount===1?"":"s")); }

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["💵 Payouts"]));
    card.appendChild(el("div", {class:"note"}, [
      "Ranked by total dots (Wolf gross wins + Dots" + (snakeHolder!==null ? ", plus " + state.snakeStake + " for everyone except whoever's holding the snake" : "") + "). Whoever has fewer dots owes the exact difference to whoever has more — pairwise, not just to the leader."
    ]));
    order.forEach(function(pi, rank){
      var row = el("div", {class:"totals-row"});
      row.appendChild(el("div", {class:"name"}, [
        el("span", {class:"eyebrow", style:"margin:0 8px 0 0; width:16px; display:inline-block;"}, ["#"+(rank+1)]),
        el("span", {class:"swatch", style:"background:"+SWATCHES[pi]}), names[pi],
        pi===snakeHolder ? el("span", {class:"eyebrow", style:"margin:0 0 0 6px; color:var(--flag);"}, ["🐍 pays everyone +" + state.snakeStake]) : null
      ]));
      row.appendChild(el("div", {class:"grand pos"}, [combined[pi] + " dots"]));
      card.appendChild(row);
    });
    main.appendChild(card);

    names.forEach(function(nm, pi){
      var owed = [];
      for(var j=0;j<n;j++){
        if(j===pi) continue;
        if(combined[j] > combined[pi]) owed.push({name:names[j], amount: combined[j]-combined[pi]});
      }
      if(owed.length === 0) return;
      owed.sort(function(a,b){ return a.amount-b.amount; });
      var pCard = el("div", {class:"card"});
      pCard.appendChild(el("h2", {style:"font-size:14px;"}, [nm + " owes"]));
      owed.forEach(function(o){
        var row = el("div", {class:"totals-row"});
        row.appendChild(el("div", {class:"name"}, [o.name]));
        row.appendChild(el("div", {class:"grand neg"}, [fmt(o.amount)]));
        pCard.appendChild(row);
      });
      main.appendChild(pCard);
    });
  }

  function renderSummary(main){
    var names = activeNames();
    var wolfGross = computeWolfGrossWins();
    var dotRes = computeDotTotals();
    var holder = currentSnakeHolder();

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["Σ Round Ledger"]));
    names.forEach(function(nm, i){
      var grand = wolfGross[i] + dotRes.totals[i];
      var row = el("div", {class:"totals-row"});
      var breakdown = "Wolf +" + wolfGross[i] +
        "  ·  Dots +" + dotRes.totals[i] +
        (holder === i ? "  ·  🐍 holding snake" : "");
      row.appendChild(el("div", {}, [
        el("div", {class:"name"}, [el("span", {class:"swatch", style:"background:"+SWATCHES[i]}), nm]),
        el("div", {class:"breakdown"}, [breakdown])
      ]));
      row.appendChild(el("div", {class:"grand " + (grand>0?"pos":"zero")}, ["+" + grand]));
      card.appendChild(row);
    });
    card.appendChild(el("div", {class:"note"}, [
      "Wolf shows gross points won (holes you won outright or as part of the winning team) — not net of what you paid on holes you lost. See Payouts below for what that actually means in owed dots or dollars."
    ]));
    main.appendChild(card);

    renderPayouts(main, names, wolfGross, dotRes.totals, holder);

    if(state.dollarPerPoint > 0){
      renderMoneyCard(main, names);
    }

    if(holder !== null){
      var sCard = el("div", {class:"card"});
      sCard.appendChild(el("div", {class:"snake-holder", style:"margin-bottom:0;"}, [
        el("div", {class:"icon"}, ["🐍"]),
        el("div", {class:"txt"}, [
          el("div", {class:"who"}, [names[holder]]),
          el("div", {class:"lbl"}, ["CURRENTLY HOLDING THE SNAKE — pays everyone +" + state.snakeStake + " in Payouts above"])
        ])
      ]));
      main.appendChild(sCard);
    }

    renderScorecard(main);
  }

  // ---------------- EVENTS ----------------
  populateHcpSelect();

  document.getElementById("prevHole").addEventListener("click", function(){
    if(state.currentHole > 1){ state.currentHole--; saveState(); render(); }
  });
  document.getElementById("nextHole").addEventListener("click", function(){
    if(state.currentHole < 18){ state.currentHole++; saveState(); render(); }
  });
  document.getElementById("parSelect").addEventListener("change", function(e){
    state.holePar[state.currentHole] = parseInt(e.target.value,10);
    saveState(); render();
  });
  document.getElementById("hcpSelect").addEventListener("change", function(e){
    state.holeHcp[state.currentHole] = parseInt(e.target.value,10);
    saveState(); render();
  });
  document.querySelectorAll("#tabs button, #tabbar button").forEach(function(b){
    b.addEventListener("click", function(){
      activeTab = this.dataset.tab;
      render();
    });
  });

  if(IS_READONLY) document.body.className += " viewer";
  if(IS_VIEWER) startViewer();
  else initAuth();
})();
</script>
</body>
</html>
