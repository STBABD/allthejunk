<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Clubhouse Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fairway:#16301F;
    --fairway-2:#1E4029;
    --turf:#2F6B45;
    --paper:#F3EEDF;
    --paper-2:#E9E1CC;
    --ink:#1B2119;
    --ink-soft:#5B6259;
    --flag:#AC3B2A;
    --flag-soft:#E7CCC5;
    --gold:#BE9A44;
    --gold-soft:#EEE3C4;
    --line:#C9BE9E;
    --radius:14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0;
    background:var(--fairway);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.4);
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--fairway);
    color:var(--paper);
    padding:16px 18px 14px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 22px);
    pointer-events:none;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    position:relative; z-index:1;
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand .sub{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--gold-soft);
    opacity:0.8;
    letter-spacing:0.5px;
  }
  .hole-nav{
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:10px;
    position:relative; z-index:1;
  }
  .hole-nav button{
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06);
    color:var(--paper);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .hole-nav button:active{ background:rgba(255,255,255,0.18); }
  .pin{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
  }
  .pin svg{ width:20px; height:26px; flex-shrink:0; }
  .pin .num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    line-height:1;
  }
  .hole-meta{
    position:relative; z-index:1;
    margin-top:10px;
    display:flex; gap:10px; justify-content:center;
  }
  .hole-meta .field{
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .hole-meta label{
    font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:0.6px;
    color:var(--gold-soft); opacity:0.85; text-transform:uppercase;
  }
  .hole-meta select{
    background:rgba(255,255,255,0.06); color:var(--paper); border:1px solid rgba(255,255,255,0.3);
    border-radius:7px; font-family:'Space Mono',monospace; font-size:12px; padding:4px 8px;
  }

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex;
    background:var(--fairway-2);
    position:sticky; top:0; z-index:5;
  }
  nav.tabs button{
    flex:1;
    padding:11px 2px;
    background:none;
    border:none;
    color:rgba(243,238,223,0.55);
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.3px;
    text-transform:uppercase;
    border-bottom:3px solid transparent;
    cursor:pointer;
  }
  nav.tabs button.active{
    color:var(--paper);
    border-bottom-color:var(--gold);
  }

  /* ---------- Main content ---------- */
  main{
    flex:1;
    padding:16px 16px calc(90px + var(--safe-b));
    overflow-y:auto;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 6px;
  }

  .strokes-strip{
    display:flex; flex-wrap:wrap; gap:6px;
    margin-bottom:14px;
  }
  .strokes-strip .pill{
    font-family:'Space Mono',monospace;
    font-size:11px; font-weight:700;
    padding:5px 10px; border-radius:999px;
    background:var(--paper-2); color:var(--ink-soft);
    display:flex; align-items:center; gap:5px;
  }
  .strokes-strip .pill.gets{
    background:var(--gold-soft); color:#6b551f;
  }
  .strokes-strip .pill .swatch{ width:7px; height:7px; border-radius:50%; }

  /* player pills */
  .player-row{
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
  }
  .player-row .swatch{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .player-row input.name-input{ flex:1; margin-bottom:0; }
  .player-row input.hcp-input{
    width:62px; padding:10px 6px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Space Mono',monospace; text-align:center; font-size:13px;
  }

  /* buttons/choices */
  .choice-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    padding:7px 13px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:13px; font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .chip.selected{
    background:var(--fairway);
    border-color:var(--fairway);
    color:var(--paper);
  }
  .chip.gold.selected{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
  .chip.flag.selected{ background:var(--flag); border-color:var(--flag); color:#fff; }
  .chip.small{ padding:5px 10px; font-size:12px; }

  select.wolf-select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    background:var(--paper);
    color:var(--ink);
  }
  label.field-label{
    font-size:12px; font-weight:600; color:var(--ink-soft);
    display:block; margin:12px 0 6px;
  }

  /* dots grid */
  .dot-table{ width:100%; border-collapse:collapse; }
  .dot-table th{
    font-family:'Space Mono',monospace;
    font-size:9.5px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--ink-soft); font-weight:600;
    padding:0 3px 8px; text-align:center;
  }
  .dot-table th:first-child{ text-align:left; }
  .dot-table td{ padding:6px 3px; text-align:center; border-top:1px dotted var(--line); }
  .dot-table td:first-child{ text-align:left; padding-right:6px; }
  .player-cell{ font-weight:600; font-size:12.5px; line-height:1.3; }
  .player-cell .badge{
    display:block; font-family:'Space Mono',monospace; font-size:9.5px;
    color:var(--gold); font-weight:700;
  }
  .dotbox{
    width:27px; height:27px; border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--paper);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; cursor:pointer; color:transparent;
  }
  .dotbox.on{ background:var(--turf); border-color:var(--turf); color:#fff; }
  .dotbox.neg.on{ background:var(--flag); border-color:var(--flag); }

  /* snake */
  .snake-holder{
    display:flex; align-items:center; gap:12px;
    background:var(--flag-soft);
    border:1px solid var(--flag);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .snake-holder .icon{ font-size:26px; }
  .snake-holder .txt .who{ font-family:'Fraunces',serif; font-weight:700; font-size:16px; color:var(--flag); }
  .snake-holder .txt .lbl{ font-family:'Space Mono',monospace; font-size:10.5px; color:#7a382e; letter-spacing:0.4px; }
  .snake-log{ font-size:12.5px; color:var(--ink-soft); line-height:1.7; }
  .snake-log .cur{ color:var(--flag); font-weight:700; }

  /* summary */
  .totals-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .totals-row:last-child{ border-bottom:none; }
  .totals-row .name{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; }
  .totals-row .breakdown{ font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .totals-row .grand{
    font-family:'Space Mono',monospace; font-weight:700; font-size:20px;
  }
  .grand.pos{ color:var(--turf); }
  .grand.neg{ color:var(--flag); }
  .grand.zero{ color:var(--ink-soft); }

  .settings-grid{ display:grid; grid-template-columns:1fr 70px; gap:8px 10px; align-items:center; }
  .settings-grid label{ font-size:13px; }
  .settings-grid input{
    width:100%; padding:7px 8px; border-radius:8px; border:1.5px solid var(--line);
    font-family:'Space Mono',monospace; text-align:center; font-size:13px;
  }

  .note{
    font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:4px;
  }

  .card-scroll{ overflow-x:auto; margin:0 -16px; padding:0 16px; }
  table.scorecard{ border-collapse:collapse; font-family:'Space Mono',monospace; }
  table.scorecard th, table.scorecard td{
    padding:5px 6px; text-align:center; font-size:10.5px; white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  table.scorecard th{ color:var(--ink-soft); font-weight:700; }
  table.scorecard td.label, table.scorecard th.label{
    position:sticky; left:0; background:#fff; text-align:left; font-family:'Inter',sans-serif;
    font-weight:700; font-size:12px; z-index:2; padding-right:10px;
    box-shadow:2px 0 4px rgba(0,0,0,0.05);
  }
  table.scorecard tr.divider td, table.scorecard tr.divider th{ background:var(--paper-2); }
  .sc-score{ font-weight:700; font-size:12px; }
  .sc-score.birdie{ color:var(--turf); }
  .sc-score.eagle{ color:var(--gold); }
  .sc-score.bogey{ color:var(--flag); }
  .sc-dots{ font-size:8.5px; color:var(--ink-soft); letter-spacing:0.3px; }
  .sc-dots.paid{ color:var(--flag); }
  .sc-wolf-win{ color:var(--turf); font-weight:700; }
  .sc-wolf-lose{ color:var(--flag); font-weight:700; }
  .sc-wolf-push{ color:var(--ink-soft); }

  .empty{
    text-align:center; padding:30px 10px; color:var(--ink-soft);
  }
  .empty .big{ font-size:34px; margin-bottom:8px; }

  button.primary{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:none;
    background:var(--fairway);
    color:var(--paper);
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    margin-top:6px;
  }
  button.ghost{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    margin-top:8px;
  }
  input.name-input{
    width:100%; padding:10px 12px; border-radius:10px;
    border:1.5px solid var(--line); font-size:14px; margin-bottom:8px;
    font-family:'Inter',sans-serif;
  }

  /* bottom tab bar */
  .tabbar{
    position:fixed;
    left:50%; transform:translateX(-50%);
    bottom:0;
    width:100%; max-width:480px;
    background:var(--fairway);
    display:flex;
    padding:8px 6px calc(10px + var(--safe-b));
    box-shadow:0 -4px 18px rgba(0,0,0,0.25);
    z-index:10;
  }
  .tabbar button{
    flex:1;
    background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:rgba(243,238,223,0.5);
    padding:6px 1px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:9.5px;
    font-weight:600;
  }
  .tabbar button .ic{ font-size:17px; }
  .tabbar button.active{ color:var(--gold); }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <h1>Clubhouse Ledger</h1>
      <div class="sub" id="roundLabel">18-HOLE ROUND</div>
    </div>
    <div class="hole-nav">
      <button id="prevHole" aria-label="Previous hole">‹</button>
      <div class="pin">
        <svg viewBox="0 0 20 26" fill="none">
          <line x1="2" y1="26" x2="2" y2="1" stroke="#F3EEDF" stroke-width="2"/>
          <path d="M2 2 L18 6 L2 11 Z" fill="#BE9A44"/>
        </svg>
        <div class="num" id="holeNum">1</div>
      </div>
      <button id="nextHole" aria-label="Next hole">›</button>
    </div>
    <div class="hole-meta">
      <div class="field">
        <label>Par</label>
        <select id="parSelect">
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="field">
        <label>Stroke Index</label>
        <select id="hcpSelect"></select>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="setup" class="active">Setup</button>
    <button data-tab="score">Score</button>
    <button data-tab="wolf">Wolf</button>
    <button data-tab="snake">Snake</button>
    <button data-tab="dots">Dots</button>
    <button data-tab="summary">Ledger</button>
  </nav>

  <main id="main"></main>

  <div class="tabbar" id="tabbar">
    <button data-tab="setup" class="active"><span class="ic">⛳</span>Setup</button>
    <button data-tab="score"><span class="ic">#</span>Score</button>
    <button data-tab="wolf"><span class="ic">🐺</span>Wolf</button>
    <button data-tab="snake"><span class="ic">🐍</span>Snake</button>
    <button data-tab="dots"><span class="ic">•</span>Dots</button>
    <button data-tab="summary"><span class="ic">Σ</span>Ledger</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var MAX_PLAYERS = 6;
  var DOT_KEYS = [
    {key:"greenie", label:"Greenie"},
    {key:"sandy", label:"Sandy"},
    {key:"birdie", label:"Birdie"},
    {key:"eagle", label:"Eagle"},
    {key:"poley", label:"Poley"},
    {key:"threeputt", label:"3-Putt"}
  ];
  var SWATCHES = ["#2F6B45","#AC3B2A","#BE9A44","#3B5C8C","#7A4FA0","#2E8B8B"];

  function blankPlayers(){ var a=[]; for(var i=0;i<MAX_PLAYERS;i++) a.push(""); return a; }
  function blankHandicaps(){ var a=[]; for(var i=0;i<MAX_PLAYERS;i++) a.push(0); return a; }

  var defaultState = {
    players: blankPlayers(),
    handicaps: blankHandicaps(),
    activePlayers: 5,
    currentHole: 1,
    holePar: {},               // hole -> 3/4/5
    holeHcp: {},                // hole -> stroke index 1-18
    wolf: {},                   // hole -> {wolf:idx, partners:[idx,...], result:'wolfwin'|'oppwin'|'push', manual:bool}
    scores: {},                  // hole -> {playerIdx: grossStrokes}
    putts: {},                   // hole -> {playerIdx: numberOfPutts}
    snakeTieBreak: {},           // hole -> playerIdx who finished last among a putts-tie (takes the snake)
    snakeEvents: [],             // kept only for legacy data; derived automatically from putts now
    dots: {},                    // hole -> {playerIdx: {greenie:bool,...}}
    points: {greenie:1, sandy:1, birdie:1, eagle:2, poley:1, threeputt:1},
    wolfUnit: 1,
    dollarPerPoint: 0
  };

  var state = null;
  var activeTab = "setup";
  var STORAGE_KEY = "clubhouse_ledger_round_v2";

  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  async function loadState(){
    try{
      var res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        state = Object.assign(clone(defaultState), parsed);
        if(!state.handicaps) state.handicaps = blankHandicaps();
        if(!state.holeHcp) state.holeHcp = {};
        if(!state.scores) state.scores = {};
        if(!state.putts) state.putts = {};
        if(!state.snakeTieBreak) state.snakeTieBreak = {};
        if(state.points && state.points.threeputt < 0) state.points.threeputt = Math.abs(state.points.threeputt);
      } else {
        state = clone(defaultState);
      }
    }catch(e){
      state = clone(defaultState);
    }
    render();
  }

  var saveTimer = null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function(){
      try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
      catch(e){ console.error("save failed", e); }
    }, 150);
  }

  function activeNames(){
    var names = [];
    for(var i=0;i<state.activePlayers;i++){
      names.push(state.players[i] && state.players[i].trim() ? state.players[i].trim() : "Player " + (i+1));
    }
    return names;
  }

  function haveNames(){
    for(var i=0;i<state.activePlayers;i++){
      if(!state.players[i] || !state.players[i].trim()) return false;
    }
    return true;
  }

  function holeHcpIndex(hole){
    return state.holeHcp[hole] || hole; // default to hole number until the user sets real stroke index
  }

  // High-handicap players (>18) need 4 putts, not 3, before it counts against them
  function puttThreshold(playerIdx){
    return (state.handicaps[playerIdx] || 0) > 18 ? 4 : 3;
  }

  // strokes a player receives on a given hole, from their handicap + the hole's stroke index
  function strokesFor(playerIdx, hole){
    var h = state.handicaps[playerIdx] || 0;
    if(h <= 0) return 0;
    var idx = holeHcpIndex(hole);
    var base = Math.floor(h / 18);
    var extra = (idx <= (h % 18)) ? 1 : 0;
    return base + extra;
  }

  function grossFor(playerIdx, hole){
    var h = state.scores[hole];
    if(!h) return null;
    var v = h[playerIdx];
    return (v === undefined || v === null || v === "") ? null : v;
  }

  function puttsFor(playerIdx, hole){
    var h = state.putts[hole];
    if(!h) return null;
    var v = h[playerIdx];
    return (v === undefined || v === null || v === "") ? null : v;
  }

  function netFor(playerIdx, hole){
    var g = grossFor(playerIdx, hole);
    if(g === null) return null;
    return g - strokesFor(playerIdx, hole);
  }

  // Derives, in hole order, every hole where a player's putts met their threshold.
  // The player with the most putts on that hole (worst) takes/keeps the snake.
  function computeSnakeEvents(){
    var n = state.activePlayers;
    var events = [];
    var holder = null; // running holder as holes are processed in order
    for(var h=1; h<=18; h++){
      if(!state.putts[h]) continue;
      var hitters = [];
      for(var pi=0; pi<n; pi++){
        var putts = puttsFor(pi, h);
        if(putts !== null && putts >= puttThreshold(pi)) hitters.push({pi:pi, putts:putts});
      }
      if(hitters.length){
        var maxPutts = Math.max.apply(null, hitters.map(function(x){ return x.putts; }));
        var worst = hitters.filter(function(x){ return x.putts === maxPutts; });
        var chosen, tied = worst.length > 1, resolved = true;
        if(tied){
          var tieBreak = state.snakeTieBreak[h];
          var tieBreakValid = tieBreak !== undefined && tieBreak !== null && worst.some(function(x){ return x.pi === tieBreak; });
          if(tieBreakValid){
            // the player recorded as finishing last among the tied group takes the snake
            chosen = tieBreak;
          } else {
            resolved = false;
            var holderStillTied = holder !== null && worst.some(function(x){ return x.pi === holder; });
            if(holderStillTied){
              chosen = holder;
            } else {
              worst.sort(function(a,b){ return a.pi - b.pi; });
              chosen = worst[0].pi;
            }
          }
        } else {
          chosen = worst[0].pi;
        }
        events.push({hole:h, player:chosen, putts:maxPutts, tied:tied, resolved: !tied || resolved, tiedPlayers: tied ? worst.map(function(x){return x.pi;}) : null});
        holder = chosen;
      }
    }
    return events;
  }

  function currentSnakeHolder(){
    var events = computeSnakeEvents();
    return events.length ? events[events.length-1].player : null;
  }

  // ---------------- WOLF LOGIC ----------------
  function wolfForHole(hole){
    var n = state.activePlayers;
    return (hole - 1) % n;
  }

  // The wolf for a hole always follows the rotation UNLESS this specific hole's
  // wolf was explicitly overridden by the user (entry.wolfManual). This means
  // any stale/frozen entry from earlier testing or a reordered roster heals
  // itself back to the correct rotation automatically.
  // A hole counts as "played" once any active player has a gross score for it —
  // this is the point past which the wolf for that hole must stop changing.
  function isHolePlayed(hole){
    for(var pi=0; pi<state.activePlayers; pi++){
      if(grossFor(pi, hole) !== null) return true;
    }
    return false;
  }

  function effectiveWolfIndex(hole){
    var entry = state.wolf[hole];
    var auto = wolfForHole(hole);
    if(!entry) return auto;

    if(entry.wolfManual){
      // manual override always wins, but still guard against an out-of-range
      // index left over from a since-shrunk roster (see #4)
      return (entry.wolf < state.activePlayers) ? entry.wolf : auto;
    }

    if(isHolePlayed(hole)){
      // Frozen: this hole already has scores, so its wolf must not silently
      // change if the roster size changes later. Still fall back to auto if
      // the frozen index itself is now out of range, to avoid resurfacing #4.
      return (entry.wolf < state.activePlayers) ? entry.wolf : auto;
    }

    // Not yet played: keep self-healing to the live rotation (fixes stale
    // frozen entries from earlier testing/roster changes), and persist the
    // current value so that whenever this hole DOES get played, whatever
    // was live at that moment is what gets frozen.
    if(entry.wolf !== auto){ entry.wolf = auto; saveState(); }
    return auto;
  }

  function wolfTeamsFor(hole){
    var entry = state.wolf[hole];
    var n = state.activePlayers;
    var wolfIdx = effectiveWolfIndex(hole);
    var partners = ((entry && entry.partners) || []).filter(function(p){ return p !== wolfIdx && p < n; });
    var wolfTeam = [wolfIdx].concat(partners);
    var othersTeam = [];
    for(var i=0;i<n;i++){ if(wolfTeam.indexOf(i) === -1) othersTeam.push(i); }
    return {wolfTeam: wolfTeam, othersTeam: othersTeam};
  }

  // Auto-computes the net-score winner for a hole's Wolf matchup, best-ball style
  // (each team's best net score represents the team). Returns null if not enough
  // scores are entered yet to decide.
  function autoWolfResult(hole){
    var entry = state.wolf[hole];
    if(!entry) return null;
    var teams = wolfTeamsFor(hole);
    function bestNet(team){
      var vals = team.map(function(p){ return netFor(p, hole); }).filter(function(v){ return v !== null; });
      if(vals.length === 0) return null;
      return Math.min.apply(null, vals);
    }
    var wb = bestNet(teams.wolfTeam);
    var ob = bestNet(teams.othersTeam);
    if(wb === null || ob === null) return null;
    if(wb < ob) return "wolfwin";
    if(ob < wb) return "oppwin";
    return "push";
  }

  // Carry-over multiplier heading into `hole`, based on consecutive pushes
  // immediately before it (resets to 1 after any decisive result).
  function computeCarryIntoHole(hole){
    var carry = 1;
    for(var h=1; h<hole; h++){
      var entry = state.wolf[h];
      if(!entry) continue;
      var result = entry.manual ? entry.result : autoWolfResult(h);
      if(!result) continue;
      if(result === "push") carry += 1;
      else carry = 1;
    }
    return carry;
  }

  function computeWolfPoints(){
    var n = state.activePlayers;
    var totals = new Array(n).fill(0);
    var carry = 1;
    for(var hole=1; hole<=18; hole++){
      var entry = state.wolf[hole];
      if(!entry) continue;
      var result = entry.manual ? entry.result : autoWolfResult(hole);
      if(!result) continue;
      if(result === "push"){
        carry += 1;
        continue;
      }
      var unit = state.wolfUnit * carry;
      var teams = wolfTeamsFor(hole);
      var wolfTeam = teams.wolfTeam, othersTeam = teams.othersTeam;
      var wolfWon = result === "wolfwin";
      var wolfDelta = (wolfWon ? 1 : -1) * unit * othersTeam.length;
      var otherDelta = (wolfWon ? -1 : 1) * unit * wolfTeam.length;
      wolfTeam.forEach(function(p){ totals[p] += wolfDelta; });
      othersTeam.forEach(function(p){ totals[p] += otherDelta; });
      carry = 1;
    }
    return totals;
  }

  // ---------------- DOTS LOGIC ----------------
  function computeDotTotals(){
    var n = state.activePlayers;
    var totals = new Array(n).fill(0);
    var counts = [];
    for(var i=0;i<n;i++){
      var c = {}; DOT_KEYS.forEach(function(d){ c[d.key]=0; }); counts.push(c);
    }
    // Manual/auto-filled dots (everything except threeputt, which now comes from putts data)
    for(var h in state.dots){
      var holeData = state.dots[h];
      for(var pIdx in holeData){
        var pi = parseInt(pIdx,10);
        if(pi >= n) continue;
        DOT_KEYS.forEach(function(d){
          if(d.key === "threeputt") return;
          if(d.key === "greenie" && (state.holePar[h] || 4) !== 3) return;
          if(holeData[pIdx][d.key]){
            totals[pi] += state.points[d.key];
            counts[pi][d.key]++;
          }
        });
      }
    }
    // 3-putt / 4-putt: derived from entered putts, paid by the putter to everyone else
    for(var hh=1; hh<=18; hh++){
      if(!state.putts[hh]) continue;
      for(var pi2=0; pi2<n; pi2++){
        var putts = puttsFor(pi2, hh);
        if(putts === null) continue;
        if(putts >= puttThreshold(pi2)){
          counts[pi2].threeputt++;
          for(var j=0;j<n;j++){ if(j !== pi2) totals[j] += state.points.threeputt; }
        }
      }
    }
    return {totals: totals, counts: counts};
  }

  // ---------------- RENDER ----------------
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for(var k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k === "html") e.innerHTML = attrs[k];
      else if(k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){
      if(typeof c === "string") e.appendChild(document.createTextNode(c));
      else if(c) e.appendChild(c);
    });
    return e;
  }

  function populateHcpSelect(){
    var sel = document.getElementById("hcpSelect");
    sel.innerHTML = "";
    for(var i=1;i<=18;i++){
      sel.appendChild(el("option", {value:i}, [String(i)]));
    }
  }

  function strokesStrip(hole){
    var names = activeNames();
    var strip = el("div", {class:"strokes-strip"});
    names.forEach(function(nm, i){
      var s = strokesFor(i, hole);
      strip.appendChild(el("div", {class:"pill" + (s>0 ? " gets":"")}, [
        el("span", {class:"swatch", style:"background:"+SWATCHES[i]}),
        nm + (s>0 ? " +" + s : " —")
      ]));
    });
    return strip;
  }

  function render(){
    document.getElementById("holeNum").textContent = state.currentHole;
    document.getElementById("parSelect").value = state.holePar[state.currentHole] || 4;
    document.getElementById("hcpSelect").value = holeHcpIndex(state.currentHole);
    document.getElementById("roundLabel").textContent =
      "HOLE " + state.currentHole + " OF 18 · " + state.activePlayers + "P";

    document.querySelectorAll("#tabs button, #tabbar button").forEach(function(b){
      b.classList.toggle("active", b.dataset.tab === activeTab);
    });

    var main = document.getElementById("main");
    main.innerHTML = "";
    if(activeTab === "setup") renderSetup(main);
    else if(!haveNames()) renderNeedSetup(main);
    else if(activeTab === "score") renderScore(main);
    else if(activeTab === "wolf") renderWolf(main);
    else if(activeTab === "snake") renderSnake(main);
    else if(activeTab === "dots") renderDots(main);
    else if(activeTab === "summary") renderSummary(main);
  }

  function renderNeedSetup(main){
    main.appendChild(el("div", {class:"card"}, [
      el("div", {class:"empty"}, [
        el("div", {class:"big"}, ["⛳"]),
        el("div", {}, ["Add your group in Setup before keeping score."])
      ])
    ]));
  }

    card.appendChild(el("h2", {}, ["Who's playing"]));
    card.appendChild(el("div", {class:"eyebrow"}, ["Group size"]));
    var sizeRow = el("div", {class:"choice-row"});
    [2,3,4,5,6].forEach(function(n){
      var chip = el("button", {
        class:"chip" + (state.activePlayers===n ? " selected":""),
        onclick:function(nn){ return function(){ state.activePlayers = nn; saveState(); render(); }; }(n)
      }, [n + " players"]);

    });

    card.appendChild(el("label", {class:"field-label"}, ["Names & course handicap"]));
    for(var i=0;i<state.activePlayers;i++){
      (function(idx){

        }));
        card.appendChild(row);
      })(i);
    }
    card.appendChild(el("div", {class:"note"}, [

    ]));
    main.appendChild(card);

    var settings = el("div", {class:"card"});
    settings.appendChild(el("h2", {}, ["Point values"]));

      }));
    });
    grid.appendChild(el("label", {}, ["Wolf point unit"]));
    grid.appendChild(el("input", {
      type:"number", value: state.wolfUnit,
      oninput:function(e){ state.wolfUnit = parseFloat(e.target.value)||1; saveState(); render(); }
    }));
    grid.appendChild(el("label", {}, ["$ per point (optional)"]));
    grid.appendChild(el("input", {
      type:"number", value: state.dollarPerPoint,
      oninput:function(e){ state.dollarPerPoint = parseFloat(e.target.value)||0; saveState(); }
    }));
    settings.appendChild(grid);
    main.appendChild(settings);

    var reset = el("div", {class:"card"});
    reset.appendChild(el("button", {
      class:"ghost",
      onclick:function(){
        if(confirm("Start a new round? This clears all scores, wolf, snake, and dots for the current round.")){
          var players = state.players, handicaps = state.handicaps, ap = state.activePlayers,
              pts = state.points, wu = state.wolfUnit, dpp = state.dollarPerPoint;
          state = clone(defaultState);
          state.players = players; state.handicaps = handicaps; state.activePlayers = ap;
          state.points = pts; state.wolfUnit = wu; state.dollarPerPoint = dpp;
          saveState(); render();
        }
      }
    }, ["Start new round (keep players, handicaps & settings)"]));
    main.appendChild(reset);
  }

  function renderScore(main){
    var hole = state.currentHole;
    var n = state.activePlayers;
    var names = activeNames();
    var par = state.holePar[hole] || 4;
    // entering a score freezes this hole's wolf, so heal it to the live rotation first
    effectiveWolfIndex(hole);
    if(!state.scores[hole]) state.scores[hole] = {};
    if(!state.putts[hole]) state.putts[hole] = {};
    var holeScores = state.scores[hole];
    var holePutts = state.putts[hole];

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["# Hole " + hole + " — score & putts  ·  Par " + par]));
    var headRow = el("div", {style:"display:flex; align-items:center; gap:8px; margin-bottom:2px;"});
    headRow.appendChild(el("div", {style:"flex:1;"}));
    headRow.appendChild(el("div", {class:"eyebrow", style:"width:62px; text-align:center; margin:0;"}, ["Gross"]));
    headRow.appendChild(el("div", {class:"eyebrow", style:"width:62px; text-align:center; margin:0;"}, ["Putts"]));
    card.appendChild(headRow);
    for(var i=0;i<n;i++){
      (function(pi){
        var s = strokesFor(pi, hole);
        var g = grossFor(pi, hole);
        var p = puttsFor(pi, hole);
        var net = netFor(pi, hole);
        var thresh = puttThreshold(pi);
        var row = el("div", {class:"player-row"});
        row.appendChild(el("div", {class:"swatch", style:"background:"+SWATCHES[pi]}));
        var label = el("div", {style:"flex:1;"}, [
          el("div", {style:"font-weight:600; font-size:14px;"}, [names[pi]]),
          el("div", {class:"breakdown"}, [
            s > 0 ? ("+" + s + " stroke  ·  ") : "",
            net !== null ? ("net " + net) : "net —",
            thresh > 3 ? ("  ·  " + thresh + "-putt rule") : ""
          ])
        ]);
        row.appendChild(label);
        row.appendChild(el("input", {
          class:"hcp-input", type:"number", placeholder:"—", min:"1", max:"15",
          value: g === null ? "" : g,
          oninput: function(e){
            var v = e.target.value;
            var num = parseInt(v,10);
            holeScores[pi] = (v === "" || isNaN(num)) ? null : num;
            saveState(); render();
          }
        }));
        row.appendChild(el("input", {
          class:"hcp-input", type:"number", placeholder:"—", min:"1", max:"10",
          value: p === null ? "" : p,
          oninput: function(e){
            var v = e.target.value;
            var num = parseInt(v,10);
            holePutts[pi] = (v === "" || isNaN(num)) ? null : num;
            saveState(); render();
          }
        }));
        card.appendChild(row);
      })(i);
    }
    card.appendChild(el("div", {class:"note"}, [
      "Net score = gross − strokes received. Wolf auto-suggests a winner from net scores. Putts feed Snake and the 3-Putt dot automatically — anyone over an 18 handicap needs 4 putts, not 3, before it counts."
    ]));
    main.appendChild(card);
  }

  function renderWolf(main){
    var hole = state.currentHole;
    var n = state.activePlayers;
    var names = activeNames();
    var autoWolf = wolfForHole(hole);
    if(!state.wolf[hole]) state.wolf[hole] = {wolf: autoWolf, wolfManual:false, partners: [], result:null, manual:false};
    var entry = state.wolf[hole];
    if(!entry.partners) entry.partners = [];
    if(entry.manual === undefined) entry.manual = false;
    if(entry.wolfManual === undefined) entry.wolfManual = false;
    var effectiveWolf = effectiveWolfIndex(hole);

    var suggestion = autoWolfResult(hole);
    var effectiveResult = entry.manual ? entry.result : suggestion;
    var carry = computeCarryIntoHole(hole);

    main.appendChild(strokesStrip(hole));

    if(carry > 1){
      var carryCard = el("div", {class:"snake-holder", style:"background:var(--gold-soft); border-color:var(--gold);"}, [
        el("div", {class:"icon"}, ["🔥"]),
        el("div", {class:"txt"}, [
          el("div", {class:"who", style:"color:#6b551f;"}, [carry + "x stakes on the line"]),
          el("div", {class:"lbl", style:"color:#6b551f;"}, [(carry-1) + " push" + (carry-1>1?"es":"") + " carried into this hole"])
        ])
      ]);
      main.appendChild(carryCard);
    }

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["🐺 Hole " + hole + " Wolf"]));

    var wolfBanner = el("div", {style:"text-align:center; padding:10px 0 16px; border-bottom:1px solid var(--line); margin-bottom:14px;"});
    wolfBanner.appendChild(el("div", {style:"font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--fairway);"}, [
      names[effectiveWolf]
    ]));
    wolfBanner.appendChild(el("div", {class:"eyebrow", style:"margin-top:2px;"}, [
      "is the wolf this hole" + (entry.wolfManual ? " (manually set)" : "")
    ]));
    card.appendChild(wolfBanner);

    var wolfLabelRow = el("div", {style:"display:flex; align-items:center; justify-content:space-between; margin:12px 0 6px;"});
    wolfLabelRow.appendChild(el("label", {class:"field-label", style:"margin:0;"}, ["Change wolf for this hole"]));
    wolfLabelRow.appendChild(el("span", {class:"eyebrow", style:"margin:0; color:" + (entry.wolfManual ? "var(--flag)" : "var(--turf)")}, [
      entry.wolfManual ? "manual" : "rotation"
    ]));
    card.appendChild(wolfLabelRow);
    var wolfSel = el("select", {class:"wolf-select", onchange:function(e){
      var picked = parseInt(e.target.value,10);
      entry.wolf = picked;
      entry.wolfManual = (picked !== autoWolf);
      entry.partners = entry.partners.filter(function(p){ return p !== picked; });
      entry.manual = false;
      saveState(); render();
    }});
    names.forEach(function(nm, i){
      wolfSel.appendChild(el("option", {value:i, selected: effectiveWolf===i}, [nm]));
    });
    card.appendChild(wolfSel);
    if(entry.wolfManual){
      card.appendChild(el("button", {
        class:"ghost",
        onclick:function(){ entry.wolfManual=false; entry.wolf=autoWolf; entry.manual=false; saveState(); render(); }
      }, ["Reset to rotation (" + names[autoWolf] + ")"]));
    }

    card.appendChild(el("label", {class:"field-label"}, [
      n <= 3 ? "Partner (optional — none = lone wolf)" : "Partners (optional — none = lone wolf)"
    ]));
    var partnerRow = el("div", {class:"choice-row"});
    names.forEach(function(nm, i){
      if(i === effectiveWolf) return;
      var isOn = entry.partners.indexOf(i) !== -1;
      partnerRow.appendChild(el("button", {
        class:"chip" + (isOn?" selected":""),
        onclick:function(idx){ return function(){
          var pos = entry.partners.indexOf(idx);
          if(pos === -1){
            // for 3 players only one partner makes sense (1v1 vs the last player)
            if(n === 3) entry.partners = [idx];
            else entry.partners.push(idx);
          } else {
            entry.partners.splice(pos,1);
          }
          entry.manual = false;
          saveState(); render();
        }; }(i)
      }, [nm]));
    });
    card.appendChild(partnerRow);
    var teams = wolfTeamsFor(hole);
    if(teams.wolfTeam.length === 1){
      card.appendChild(el("div", {class:"note"}, ["Lone Wolf — " + names[effectiveWolf] + " vs everyone else."]));
    }

    var resultLabelRow = el("div", {style:"display:flex; align-items:center; justify-content:space-between; margin-top:12px;"});
    resultLabelRow.appendChild(el("label", {class:"field-label", style:"margin:0;"}, ["Result"]));
    resultLabelRow.appendChild(el("span", {class:"eyebrow", style:"margin:0; color:" + (entry.manual ? "var(--flag)" : "var(--turf)")}, [
      entry.manual ? "manual" : (suggestion ? "auto from scores" : "no scores yet")
    ]));
    card.appendChild(resultLabelRow);

    var wolfTeamNames = teams.wolfTeam.map(function(p){ return names[p]; }).join(" & ");
    var othersNames = teams.othersTeam.map(function(p){ return names[p]; });
    var resRow = el("div", {class:"choice-row"});
    resRow.appendChild(el("button", {
      class:"chip" + (effectiveResult==="wolfwin"?" selected":""),
      onclick:function(){ entry.result="wolfwin"; entry.manual=true; saveState(); render(); }
    }, [wolfTeamNames + " won"]));
    resRow.appendChild(el("button", {
      class:"chip flag" + (effectiveResult==="oppwin"?" selected":""),
      onclick:function(){ entry.result="oppwin"; entry.manual=true; saveState(); render(); }
    }, [othersNames.join(" & ") + " won"]));
    resRow.appendChild(el("button", {
      class:"chip" + (effectiveResult==="push"?" selected":""),
      onclick:function(){ entry.result="push"; entry.manual=true; saveState(); render(); }
    }, ["Push"]));
    card.appendChild(resRow);

    if(!suggestion && !entry.manual){
      card.appendChild(el("div", {class:"note"}, ["Enter gross scores in the Score tab to auto-suggest a winner, or tap a result above to set it yourself."]));
    }
    if(entry.manual){
      card.appendChild(el("button", {
        class:"ghost",
        onclick:function(){ entry.manual=false; saveState(); render(); }
      }, ["Reset to auto (from scores)"]));
    }

    main.appendChild(card);

    // running wolf totals
    var totals = computeWolfPoints();
    var sumCard = el("div", {class:"card"});
    sumCard.appendChild(el("h2", {}, ["Wolf points so far"]));
    names.forEach(function(nm, i){
      var t = totals[i];
      var row = el("div", {class:"totals-row"});
      row.appendChild(el("div", {class:"name"}, [
        el("span", {class:"swatch", style:"background:"+SWATCHES[i]}), nm
      ]));
      row.appendChild(el("div", {class:"grand " + (t>0?"pos":t<0?"neg":"zero")}, [(t>0?"+":"")+t]));
      sumCard.appendChild(row);
    });
    sumCard.appendChild(el("div", {class:"note"}, [
      "A push carries its stakes into the next hole instead of settling — two pushes in a row means the third decisive hole pays out 3x."
    ]));
    main.appendChild(sumCard);
  }

  function renderSnake(main){
    var hole = state.currentHole;
    var n = state.activePlayers;
    var names = activeNames();
    var events = computeSnakeEvents();
    var holder = events.length ? events[events.length-1].player : null;

    var holderCard = el("div", {class:"snake-holder"});
    if(holder === null){
      holderCard.appendChild(el("div", {class:"icon"}, ["🐍"]));
      holderCard.appendChild(el("div", {class:"txt"}, [
        el("div", {class:"who"}, ["No one — yet"]),
        el("div", {class:"lbl"}, ["FIRST PUTT LIMIT HIT TAKES THE SNAKE"])
      ]));
    } else {
      holderCard.appendChild(el("div", {class:"icon"}, ["🐍"]));
      holderCard.appendChild(el("div", {class:"txt"}, [
        el("div", {class:"who"}, [names[holder]]),
        el("div", {class:"lbl"}, ["IS HOLDING THE SNAKE"])
      ]));
    }
    main.appendChild(holderCard);

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["🐍 Hole " + hole + " putts"]));
    var row = el("div", {class:"strokes-strip"});
    names.forEach(function(nm, i){
      var p = puttsFor(i, hole);
      var thresh = puttThreshold(i);
      var hit = p !== null && p >= thresh;
      row.appendChild(el("div", {class:"pill" + (hit ? " gets":"")}, [
        el("span", {class:"swatch", style:"background:"+SWATCHES[i]}),
        nm + ": " + (p === null ? "—" : p) + " / " + thresh + "-putt"
      ]));
    });
    card.appendChild(row);
    card.appendChild(el("div", {class:"note"}, [
      "Enter putts per player in the Score tab — the snake moves automatically to whoever hits their putt limit. If two or more players tie on the same hole, the snake goes to whoever finished (holed out) last — tap below to say who that was."
    ]));
    main.appendChild(card);

    // show a tie card for every unresolved tie in the round, plus the current
    // hole's tie even once resolved so the pick can still be corrected
    var tieEvents = events.filter(function(ev){ return ev.tied && (!ev.resolved || ev.hole === hole); });
    tieEvents.forEach(function(tev){
      var tieCard = el("div", {class:"card"}, [
        el("h2", {}, ["🐍 Hole " + tev.hole + " tied at " + tev.putts + " putts — who finished last?"])
      ]);
      var tieRow = el("div", {class:"choice-row"});
      tev.tiedPlayers.forEach(function(pi){
        tieRow.appendChild(el("button", {
          class:"chip flag" + (state.snakeTieBreak[tev.hole] === pi ? " selected" : ""),
          onclick:function(idx){ return function(){
            state.snakeTieBreak[tev.hole] = idx;
            saveState(); render();
          }; }(pi)
        }, [names[pi]]));
      });
      tieCard.appendChild(tieRow);
      if(!tev.resolved){
        tieCard.appendChild(el("div", {class:"note"}, [
          "Not resolved yet — for now the snake is defaulting to " + names[tev.player] + " (whoever already held it, or earliest in player order). Tap the actual last player above to correct it."
        ]));
      }
      main.appendChild(tieCard);
    });

    if(events.length){
      var log = el("div", {class:"card"});
      log.appendChild(el("h2", {}, ["Snake trail"]));
      var lines = events.map(function(ev,i,arr){
        var isCur = i === arr.length-1;
        return el("div", {class: isCur ? "cur" : ""}, [
          "Hole " + ev.hole + " — " + names[ev.player] + " (" + ev.putts + " putts" + (ev.tied ? (ev.resolved ? ", tied — resolved" : ", tied — unresolved") : "") + ")" + (isCur ? " (current)" : "")
        ]);
      });
      var logWrap = el("div", {class:"snake-log"}, lines);
      log.appendChild(logWrap);
      main.appendChild(log);
    }
  }

  function renderDots(main){
    var hole = state.currentHole;
    var n = state.activePlayers;
    var names = activeNames();
    if(!state.dots[hole]) state.dots[hole] = {};
    var holeData = state.dots[hole];
    for(var i=0;i<n;i++){
      if(!holeData[i]) holeData[i] = {};
    }

    var par = state.holePar[hole] || 4;
    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["• Hole " + hole + " Dots"]));
    card.appendChild(el("button", {
      class:"ghost", style:"margin-top:0; margin-bottom:12px;",
      onclick:function(){
        for(var i=0;i<n;i++){
          var g = grossFor(i, hole);
          if(g === null) continue;
          var diff = g - par;
          holeData[i].eagle = diff <= -2;
          holeData[i].birdie = diff === -1;
        }
        saveState(); render();
      }
    }, ["Auto-fill birdie/eagle from gross score"]));
    var table = el("table", {class:"dot-table"});
    var thead = el("tr");
    thead.appendChild(el("th", {}, ["Player"]));
    DOT_KEYS.forEach(function(d){ thead.appendChild(el("th", {}, [d.label])); });
    table.appendChild(thead);

    for(var p=0;p<n;p++){
      (function(pi){
        var tr = el("tr");
        var s = strokesFor(pi, hole);
        var thresh = puttThreshold(pi);
        var nameCell = el("td");
        var pc = el("div", {class:"player-cell"}, [names[pi]]);
        if(s>0) pc.appendChild(el("span", {class:"badge"}, ["+" + s + " stroke" + (s>1?"s":"")]));
        if(thresh > 3) pc.appendChild(el("span", {class:"badge"}, [thresh + "-putt rule"]));
        nameCell.appendChild(pc);
        tr.appendChild(nameCell);
        DOT_KEYS.forEach(function(d){
          var td = el("td");
          if(d.key === "threeputt"){
            var putts = puttsFor(pi, hole);
            var hit = putts !== null && putts >= thresh;
            td.appendChild(el("div", {class:"dotbox neg" + (hit?" on":"")}, [hit ? "●" : ""]));
          } else if(d.key === "greenie" && par !== 3){
            td.appendChild(el("div", {class:"dotbox", style:"opacity:0.25; cursor:default;"}, ["—"]));
          } else {
            var on = !!holeData[pi][d.key];
            td.appendChild(el("div", {
              class:"dotbox" + (on?" on":""),
              onclick:function(){
                holeData[pi][d.key] = !holeData[pi][d.key];
                saveState(); render();
              }
            }, [on ? "●" : ""]));
          }
          tr.appendChild(td);
        });
        table.appendChild(tr);
      })(p);
    }
    card.appendChild(table);
    card.appendChild(el("div", {class:"note"}, [
      "Birdie/eagle auto-fill uses gross score vs. par. Enter scores in the Score tab first. Greenie only applies on par 3s (grayed out otherwise). The 3-Putt column is automatic from putts entered in the Score tab — players over an 18 handicap need 4 putts before it counts (see the badge under their name)."
    ]));
    main.appendChild(card);

    var dotRes = computeDotTotals();
    var sumCard = el("div", {class:"card"});
    sumCard.appendChild(el("h2", {}, ["Dots so far"]));
    names.forEach(function(nm, i){
      var t = dotRes.totals[i];
      var row = el("div", {class:"totals-row"});
      var breakdown = DOT_KEYS.filter(function(d){return dotRes.counts[i][d.key]>0;})
        .map(function(d){
          if(d.key === "threeputt") return "3-Putt x" + dotRes.counts[i][d.key] + " (paid out)";
          return d.label + " x" + dotRes.counts[i][d.key];
        }).join(" · ");
      var nameCol = el("div", {}, [
        el("div", {class:"name"}, [el("span", {class:"swatch", style:"background:"+SWATCHES[i]}), nm]),
        breakdown ? el("div", {class:"breakdown"}, [breakdown]) : null
      ]);
      row.appendChild(nameCol);
      row.appendChild(el("div", {class:"grand " + (t>0?"pos":t<0?"neg":"zero")}, [(t>0?"+":"")+t]));
      sumCard.appendChild(row);
    });
    main.appendChild(sumCard);
  }

  function sumHolePar(start, end){
    var t = 0;
    for(var h=start; h<=end; h++){ t += (state.holePar[h] || 4); }
    return t;
  }

  function sumGross(pi, start, end){
    var t = 0, any = false;
    for(var h=start; h<=end; h++){
      var g = grossFor(pi, h);
      if(g !== null){ t += g; any = true; }
    }
    return any ? t : null;
  }

  function dotAbbrevs(pi, hole){
    var holeData = state.dots[hole] && state.dots[hole][pi];
    var out = [];
    if(holeData){
      if((state.holePar[hole]||4) === 3 && holeData.greenie) out.push("G");
      if(holeData.sandy) out.push("S");
      if(holeData.poley) out.push("P");
    }
    return out;
  }

  function renderScorecard(main){
    var names = activeNames();
    var n = state.activePlayers;
    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["Full Scorecard"]));

    var scroll = el("div", {class:"card-scroll"});
    var table = el("table", {class:"scorecard"});

    // Header: hole numbers
    var headRow = el("tr");
    headRow.appendChild(el("th", {class:"label"}, [""]));
    for(var h=1; h<=18; h++){ headRow.appendChild(el("th", {}, [String(h)])); }
    headRow.appendChild(el("th", {}, ["OUT"]));
    headRow.appendChild(el("th", {}, ["IN"]));
    headRow.appendChild(el("th", {}, ["TOT"]));
    table.appendChild(headRow);

    // Par row
    var parRow = el("tr", {class:"divider"});
    parRow.appendChild(el("th", {class:"label"}, ["Par"]));
    for(var h2=1; h2<=18; h2++){ parRow.appendChild(el("td", {}, [String(state.holePar[h2]||4)])); }
    parRow.appendChild(el("td", {}, [String(sumHolePar(1,9))]));
    parRow.appendChild(el("td", {}, [String(sumHolePar(10,18))]));
    parRow.appendChild(el("td", {}, [String(sumHolePar(1,18))]));
    table.appendChild(parRow);

    // Wolf row
    var wolfRow = el("tr", {class:"divider"});
    wolfRow.appendChild(el("th", {class:"label"}, ["🐺 Wolf"]));
    for(var h3=1; h3<=18; h3++){
      var entry = state.wolf[h3];
      var cell = el("td");
      if(entry){
        var result = entry.manual ? entry.result : autoWolfResult(h3);
        var wolfInitial = names[effectiveWolfIndex(h3)].charAt(0).toUpperCase();
        if(result === "wolfwin"){
          var carryW = computeCarryIntoHole(h3);
          cell = el("td", {class:"sc-wolf-win"}, [wolfInitial + "✓" + (carryW>1 ? "×"+carryW : "")]);
        } else if(result === "oppwin"){
          var carryL = computeCarryIntoHole(h3);
          cell = el("td", {class:"sc-wolf-lose"}, [wolfInitial + "✗" + (carryL>1 ? "×"+carryL : "")]);
        } else if(result === "push"){
          cell = el("td", {class:"sc-wolf-push"}, ["="]);
        } else {
          cell = el("td", {}, ["–"]);
        }
      } else {
        cell = el("td", {}, ["–"]);
      }
      wolfRow.appendChild(cell);
    }
    wolfRow.appendChild(el("td", {}, [""]));
    wolfRow.appendChild(el("td", {}, [""]));
    wolfRow.appendChild(el("td", {}, [""]));
    table.appendChild(wolfRow);

    // One row per player: gross score (colored) + dot abbreviations + 3/4-putt marker
    for(var pi=0; pi<n; pi++){
      (function(pi){
        var row = el("tr");
        row.appendChild(el("th", {class:"label"}, [
          el("span", {class:"swatch", style:"background:"+SWATCHES[pi]+"; margin-right:6px; display:inline-block;"}),
          names[pi]
        ]));
        for(var h=1; h<=18; h++){
          var par = state.holePar[h] || 4;
          var g = grossFor(pi, h);
          var putts = puttsFor(pi, h);
          var thresh = puttThreshold(pi);
          var hitPutt = putts !== null && putts >= thresh;
          var scoreClass = "sc-score";
          if(g !== null){
            var diff = g - par;
            if(diff <= -2) scoreClass += " eagle";
            else if(diff === -1) scoreClass += " birdie";
            else if(diff >= 2) scoreClass += " bogey";
          }
          var tags = dotAbbrevs(pi, h);
          if(hitPutt) tags = tags.concat([putts + "P"]);
          var cell = el("td", {}, [
            el("div", {class:scoreClass}, [g === null ? "–" : String(g)]),
            tags.length ? el("div", {class:"sc-dots" + (hitPutt?" paid":"")}, [tags.join(" ")]) : null
          ]);
          row.appendChild(cell);
        }
        var out = sumGross(pi,1,9), inn = sumGross(pi,10,18), tot = sumGross(pi,1,18);
        row.appendChild(el("td", {}, [el("div", {class:"sc-score"}, [out===null?"–":String(out)])]));
        row.appendChild(el("td", {}, [el("div", {class:"sc-score"}, [inn===null?"–":String(inn)])]));
        row.appendChild(el("td", {}, [el("div", {class:"sc-score"}, [tot===null?"–":String(tot)])]));
        table.appendChild(row);
      })(pi);
    }

    scroll.appendChild(table);
    card.appendChild(scroll);
    card.appendChild(el("div", {class:"note"}, [
      "G = greenie, S = sandy, P = poley, \"3P\"/\"4P\" = hit their putt limit that hole (paid out to the table). Birdies show green, eagles gold, double-bogey-or-worse red. Wolf row: initial + ✓/✗/= for that hole's result, ×N when carry-over stakes applied. Swipe to see all 18 holes."
    ]));
    main.appendChild(card);
  }

  function renderSummary(main){
    var names = activeNames();
    var wolfTotals = computeWolfPoints();
    var dotRes = computeDotTotals();
    var holder = currentSnakeHolder();

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["Σ Round Ledger"]));
    names.forEach(function(nm, i){
      var grand = wolfTotals[i] + dotRes.totals[i];
      var row = el("div", {class:"totals-row"});
      var breakdown = "Wolf " + (wolfTotals[i]>=0?"+":"") + wolfTotals[i] +
        "  ·  Dots " + (dotRes.totals[i]>=0?"+":"") + dotRes.totals[i] +
        (holder === i ? "  ·  🐍 holding snake" : "");
      row.appendChild(el("div", {}, [
        el("div", {class:"name"}, [el("span", {class:"swatch", style:"background:"+SWATCHES[i]}), nm]),
        el("div", {class:"breakdown"}, [breakdown])
      ]));
      row.appendChild(el("div", {class:"grand " + (grand>0?"pos":grand<0?"neg":"zero")}, [(grand>0?"+":"")+grand]));
      card.appendChild(row);
    });
    main.appendChild(card);

    if(state.dollarPerPoint > 0){
      var dCard = el("div", {class:"card"});
      dCard.appendChild(el("h2", {}, ["Settling up"]));
      names.forEach(function(nm, i){
        var grand = wolfTotals[i] + dotRes.totals[i];
        var dollars = grand * state.dollarPerPoint;
        var row = el("div", {class:"totals-row"});
        row.appendChild(el("div", {class:"name"}, [nm]));
        row.appendChild(el("div", {class:"grand " + (dollars>0?"pos":dollars<0?"neg":"zero")},
          [(dollars>=0?"+$":"-$") + Math.abs(dollars).toFixed(2)]));
        dCard.appendChild(row);
      });
      main.appendChild(dCard);
    }

    if(holder !== null){
      var sCard = el("div", {class:"card"});
      sCard.appendChild(el("div", {class:"snake-holder", style:"margin-bottom:0;"}, [
        el("div", {class:"icon"}, ["🐍"]),
        el("div", {class:"txt"}, [
          el("div", {class:"who"}, [names[holder]]),
          el("div", {class:"lbl"}, ["CURRENTLY HOLDING THE SNAKE"])
        ])
      ]));
      main.appendChild(sCard);
    }

    renderScorecard(main);
  }

  // ---------------- EVENTS ----------------
  populateHcpSelect();

  document.getElementById("prevHole").addEventListener("click", function(){
    if(state.currentHole > 1){ state.currentHole--; saveState(); render(); }
  });
  document.getElementById("nextHole").addEventListener("click", function(){
    if(state.currentHole < 18){ state.currentHole++; saveState(); render(); }
  });
  document.getElementById("parSelect").addEventListener("change", function(e){
    state.holePar[state.currentHole] = parseInt(e.target.value,10);
    saveState(); render();
  });
  document.getElementById("hcpSelect").addEventListener("change", function(e){
    state.holeHcp[state.currentHole] = parseInt(e.target.value,10);
    saveState(); render();
  });
  document.querySelectorAll("#tabs button, #tabbar button").forEach(function(b){
    b.addEventListener("click", function(){
      activeTab = this.dataset.tab;
      render();
    });
  });

  loadState();
})();
</script>
</body>
</html>
